name: Adidas löparskor

# adidas.se blockerar GitHubs servrar (HTTP 403), så hämtningen görs av Mac Minin
# (python3 adidas_lopskor.py --push). Den här workflowen publicerar bara sidan
# med GitHub Pages varje gång ny data skickas till repot.

on:
  push:
    branches: [main]
    paths:
      - "adidas_lopskor/**"
  workflow_dispatch:          # publicera manuellt via Actions -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adidas-lopskor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Förbered Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp sidan
        uses: actions/upload-pages-artifact@v3
        with:
          path: adidas_lopskor

      - name: Publicera
        id: deploy
        uses: actions/deploy-pages@v4
